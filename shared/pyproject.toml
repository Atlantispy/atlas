[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-shared"
version = "0.1.0"
description = "Shared runtime support for Atlas modules"
requires-python = ">=3.12,<3.14"
dependencies = ["gmpy2==2.3.2", "numpy>=2.0,<3"]
license = {text = "AGPL-3.0-only"}

[project.optional-dependencies]
acceptance = ["psutil>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]
