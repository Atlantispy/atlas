# Quick public tests on every push and pull request (issue 103).
# A pass is a code check only. It is never scientific acceptance, and no seal, checkpoint or private
# input is supplied: tests that need one skip themselves. The unified tectonics job omits the
# explicitly registered slow tests and reports them in its summary.
name: quick-tests

# Branch pushes only: a tag push re-runs the same commit already tested on its branch.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Pushes group by commit, so every pushed commit's run finishes; a pull request cancels its older run.
concurrency:
  group: quick-tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Every repository path the workflow uses, named once. A folder move edits this block only.
env:
  TOOLS: tools
  ROOT_TESTS: tests
  DEV_PROFILES: development/PROFILES.json
  PACKAGE_SRC: tectonics/src
  PACKAGE_TESTS: tectonics/tests
  SHARED_SRC: shared/src
  # Core route plus psutil: package modules import it at load time (continuation_guard, since dev55).
  REQUIREMENTS: tectonics/requirements/windows-amd64-cp312-acceptance.txt
  PYTHONDONTWRITEBYTECODE: "1"
  # Writes one runner summary's counts to the run's summary page.
  COUNTS: >-
    import json, os, sys;
    p = sys.argv[1];
    s = json.load(open(p, encoding='utf-8')) if os.path.exists(p) else None;
    c = s and s['counts'];
    row = s and '| %s | %d | %d | %d | %d | %d | %d | %.1f |' % (p, s['tests_selected'], c['success'], c['failure'], c['error'], c['skipped'], len(s['omitted_slow']), s['wall_seconds'] / 60);
    open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('| run | selected | passed | failed | errors | skipped | omitted slow | minutes |\n|---|---|---|---|---|---|---|---|\n' + (row or '| %s | no summary written |' % p) + '\n')

jobs:
  static-and-tooling:
    name: Static checks and public tooling
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      # Some root tests import the generator packages, which need numpy.
      - name: Install the pinned dependencies (wheels only)
        run: python -m pip install --disable-pip-version-check -r "$env:REQUIREMENTS"
      - name: Coding-safety check
        run: python -B "$env:TOOLS/check_coding_safety.py"
      - name: Public-path check
        run: python -B "$env:TOOLS/check_public_paths.py"
      # The tooling profile's modules run in the next step, through the launcher they need.
      - name: Repository-root tests
        run: |
          $env:PYTHONPATH = (Resolve-Path -LiteralPath $env:SHARED_SRC).Path
          $launched = (Get-Content -Raw "$env:DEV_PROFILES" | ConvertFrom-Json).profiles.tooling.tests | ForEach-Object { "$_.py" }
          $files = Get-ChildItem "$env:ROOT_TESTS" -Filter 'test_*.py' | Where-Object { $launched -notcontains $_.Name } | ForEach-Object { "$env:ROOT_TESTS/$($_.Name)" }
          python -B -m unittest -v @files
      # A platform skip marks a profile INCOMPLETE and exits 1; only failures and errors fail this step.
      - name: Public development profiles (standard library only)
        run: |
          python -I -B "$env:TOOLS/develop.py" bootstrap
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.atlas-dev\venv\Scripts\python.exe -I -B "$env:TOOLS/develop.py" test --binding .atlas-dev/bindings/initial.json --profile all-public --report .atlas-dev/tests-initial.json
          python -I -B -c "import json, sys; r = json.load(open(sys.argv[1], encoding='utf-8'))['profiles']; bad = [p['profile'] for p in r if p['failures'] or p['errors'] or not p['tests_run']]; [print(p['profile'], p['status'], 'run', p['tests_run'], 'skipped', p['skipped']) for p in r]; sys.exit('failed: %s' % bad if bad else 0)" .atlas-dev/tests-initial.json


  tectonics-tests:
    name: Unified tectonics package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - name: Install the pinned dependencies (wheels only)
        run: python -m pip install --disable-pip-version-check -r "$env:REQUIREMENTS"
      - name: Tectonics tests
        run: |
          python -I -B "$env:TOOLS/run_tests_parallel.py" --ci --python python --workers $env:NUMBER_OF_PROCESSORS --src "$env:PACKAGE_SRC" --tests-dir "$env:PACKAGE_TESTS" --summary summary-package.json
      - name: Counts to the run summary
        if: ${{ !cancelled() }}
        run: python -I -B -c "$env:COUNTS" summary-package.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: summary-package
          path: summary-package.json
          if-no-files-found: ignore
